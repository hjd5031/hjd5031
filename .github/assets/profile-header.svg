<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Jaedong Hwang — real-time graphics and game development</title>
  <desc id="desc">A dark blue, graphics-inspired profile banner with a wireframe orb.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b14"/>
      <stop offset="0.52" stop-color="#0b1f36"/>
      <stop offset="1" stop-color="#07101d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#38d9c5"/>
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#1f8fff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#1f8fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mintGlow">
      <stop offset="0" stop-color="#38d9c5" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#38d9c5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#58a6ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#background)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="1020" cy="118" r="280" fill="url(#blueGlow)"/>
    <circle cx="735" cy="330" r="250" fill="url(#mintGlow)"/>

    <path d="M0 260 C260 210 420 315 690 254 C900 207 1055 244 1200 188 V320 H0Z" fill="#0a1625" fill-opacity="0.76"/>
    <path d="M0 260 C260 210 420 315 690 254 C900 207 1055 244 1200 188" fill="none" stroke="url(#accent)" stroke-opacity="0.3"/>

    <g fill="none" stroke="#6cb6ff" stroke-opacity="0.42" transform="translate(1014 146)">
      <circle r="104" stroke-width="1.5"/>
      <circle r="78" stroke-opacity="0.25"/>
      <ellipse rx="104" ry="35"/>
      <ellipse rx="104" ry="35" transform="rotate(60)"/>
      <ellipse rx="104" ry="35" transform="rotate(120)"/>
      <path d="M-89-54 Q0-15 89-54 M-89 54 Q0 15 89 54" stroke-opacity="0.23"/>
      <circle r="4" fill="#38d9c5" stroke="none" filter="url(#softGlow)"/>
      <circle cx="72" cy="-75" r="3" fill="#58a6ff" stroke="none"/>
      <circle cx="-94" cy="-33" r="2.5" fill="#38d9c5" stroke="none"/>
    </g>

    <g fill="#8bcaef">
      <circle cx="749" cy="63" r="2" opacity="0.7"/>
      <circle cx="829" cy="107" r="1.5" opacity="0.5"/>
      <circle cx="908" cy="48" r="2" opacity="0.55"/>
      <circle cx="1128" cy="72" r="1.5" opacity="0.7"/>
      <circle cx="1161" cy="247" r="2" opacity="0.4"/>
      <circle cx="790" cy="232" r="1.5" opacity="0.55"/>
    </g>

    <g font-family="Inter, Segoe UI, Arial, sans-serif">
      <text x="74" y="82" fill="#58a6ff" font-size="14" font-weight="700" letter-spacing="5">HELLO, I'M</text>
      <text x="70" y="147" fill="#f0f6fc" font-size="54" font-weight="750" letter-spacing="1">JAEDONG HWANG</text>
      <rect x="73" y="169" width="332" height="3" rx="1.5" fill="url(#accent)"/>
      <text x="73" y="207" fill="#b7c9db" font-size="18" font-weight="500" letter-spacing="1.5">REAL-TIME GRAPHICS  /  GAME DEVELOPMENT</text>
      <text x="73" y="249" fill="#71879d" font-size="13" font-weight="600" letter-spacing="2.5">C++  ·  OPENGL  ·  UNREAL ENGINE  ·  UNITY</text>
    </g>

    <path d="M24 24h42 M24 24v42 M1176 296h-42 M1176 296v-42" fill="none" stroke="#58a6ff" stroke-opacity="0.42" stroke-width="2"/>
  </g>
</svg>
